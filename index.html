    .petals{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.petals span{
  position:absolute;
  top:-10%;
  width:18px;
  height:18px;
  background:rgba(255,182,193,0.45);
  border-radius:70% 30% 70% 30%;
  animation:fall linear infinite;
  filter:blur(0.5px);
}


/* DIFFERENT PETALS */

.petals span:nth-child(1){
  left:10%;
  animation-duration:12s;
  animation-delay:0s;
}

.petals span:nth-child(2){
  left:20%;
  animation-duration:18s;
  animation-delay:2s;
}

.petals span:nth-child(3){
  left:35%;
  animation-duration:14s;
  animation-delay:1s;
}

.petals span:nth-child(4){
  left:50%;
  animation-duration:20s;
  animation-delay:4s;
}

.petals span:nth-child(5){
  left:65%;
  animation-duration:13s;
  animation-delay:3s;
}

.petals span:nth-child(6){
  left:80%;
  animation-duration:16s;
  animation-delay:1s;
}

.petals span:nth-child(7){
  left:90%;
  animation-duration:19s;
  animation-delay:5s;
}


@keyframes fall{

  0%{
    transform:
      translateY(-10vh)
      rotate(0deg)
      translateX(0);
    opacity:0;
  }

  10%{
    opacity:1;
  }

  100%{
    transform:
      translateY(120vh)
      rotate(360deg)
      translateX(80px);
    opacity:0;
  }

}

  <script>

  function openAlbum(id){

    document.getElementById(id).style.display = "block";

  }

  function closeAlbum(id){

    document.getElementById(id).style.display = "none";

  }


  // IMAGE SLIDER

  let currentImages = [];
  let currentIndex = 0;


  function openImage(src){

    const popup = document.getElementById("image-popup");
    const popupImg = document.getElementById("popup-img");

    popup.style.display = "flex";

    // get all images from opened album
    const visibleAlbum = document.querySelector('.album-page[style*="block"]');

    currentImages = Array.from(
      visibleAlbum.querySelectorAll('.album-images img')
    );

    currentIndex = currentImages.findIndex(
      img => img.src === src
    );

    popupImg.src = src;

  }


  function closeImage(){

    document.getElementById("image-popup").style.display = "none";

  }


  function nextImage(){

    currentIndex++;

    if(currentIndex >= currentImages.length){
      currentIndex = 0;
    }

    document.getElementById("popup-img").src =
      currentImages[currentIndex].src;

  }


  function prevImage(){

    currentIndex--;

    if(currentIndex < 0){
      currentIndex = currentImages.length - 1;
    }

    document.getElementById("popup-img").src =
      currentImages[currentIndex].src;

  }


  </script>

  <img id="popup-img">
  <span class="arrow right-arrow" onclick="nextImage()">❯</span>
</div>
<script>

    petal.style.transform =
      `scale(${0.5 + Math.random()})`;

    petalsContainer.appendChild(petal);

  }

</script>
