  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      background:#f7f4f1;
      color:#333;
    }
      .arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:60px;
      color:white;
      cursor:pointer;
      user-select:none;
      padding:20px;
    }

    .left-arrow{
      left:20px;
    }

    .right-arrow{
      right:20px;
    }
    #image-popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:2000;
    }

    #popup-img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
    }
  .year-title{
    font-size:2rem;
    margin-bottom:60px;
    text-align:center;
    font-family:'Poppins', serif;
  }
    .popup-close{
    position:absolute;
    top:20px;
    right:40px;
    color:white;
    font-size:50px;
    cursor:pointer;
    }
    header{
      height:70vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(to bottom right,#ffd6e0,#fff0d6);
      padding:20px;
    }

    header h1{
      font-family:'Playfair Display',serif;  
      font-size:5rem;
      letter-spacing:2px;
      margin-bottom:10px;
    }

    header p{
      font-size:1.2rem;
    }

    section{
      padding:60px 10%;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .album{
      cursor:pointer;
      text-align:center;
    }

    .album img{
      width:100%;
      height:320px;
      object-fit:cover;
      border-radius:20px;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .album img:hover{
      transform:scale(1.03);
    }

    .album h3{
      margin-top:12px;
      font-size:1.3rem;
      font-family:'Poppins', sans-serif;
    }

    .album-page{
      display:none;
      position:fixed;
      inset:0;
      background:white;
      overflow:auto;
      padding:50px;
      z-index:1000;
    }

    .album-page h2{
      text-align:center;
      margin-bottom:30px;
      font-size:2.5rem;
    }

    .album-images{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .album-images img{
      width:100%;
      border-radius:20px;
      object-fit:cover;
    }

    .close{
      position:absolute;
      top:20px;
      right:30px;
      font-size:45px;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:30px;
      background:#222;
      color:white;
    }

    @media(max-width:768px){

      header h1{
        font-size:2.5rem;
      }

  <script>

  function openAlbum(id){

    document.getElementById(id).style.display = "block";

  }

  function closeAlbum(id){

    document.getElementById(id).style.display = "none";

  }


  // IMAGE SLIDER

  let currentImages = [];
  let currentIndex = 0;


  function openImage(src){

    const popup = document.getElementById("image-popup");
    const popupImg = document.getElementById("popup-img");

    popup.style.display = "flex";

    // get all images from opened album
    const visibleAlbum = document.querySelector('.album-page[style*="block"]');

    currentImages = Array.from(
      visibleAlbum.querySelectorAll('.album-images img')
    );

    currentIndex = currentImages.findIndex(
      img => img.src === src
    );

    popupImg.src = src;

  }


  function closeImage(){

    document.getElementById("image-popup").style.display = "none";

  }


  function nextImage(){

    currentIndex++;

    if(currentIndex >= currentImages.length){
      currentIndex = 0;
    }

    document.getElementById("popup-img").src =
      currentImages[currentIndex].src;

  }


  function prevImage(){

    currentIndex--;

    if(currentIndex < 0){
      currentIndex = currentImages.length - 1;
    }

    document.getElementById("popup-img").src =
      currentImages[currentIndex].src;

  }


  </script>
<div id="image-popup">

  <span class="popup-close" onclick="closeImage()">×</span>
  <span class="arrow left-arrow" onclick="prevImage()">❮</span>
  <img id="popup-img">
  <span class="arrow right-arrow" onclick="nextImage()">❯</span>
</div>
